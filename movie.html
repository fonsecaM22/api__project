<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/293aa5b3ae.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Movie Card -->
    <section id="movieContainer">

        <div class="movie-card">

            <img
                id="moviePoster"
                src="https://placehold.co/300x450?text=Movie+Poster"
                alt="Movie Poster"
            >

            <div class="movie-info">

                <h2 id="movieTitle">Movie Title</h2>

                <p><strong>Year:</strong> <span id="movieYear">----</span></p>

                <p><strong>Rating:</strong> ⭐ <span id="movieRating">----</span></p>

                <p><strong>Genre:</strong> <span id="movieGenre">----</span></p>

                <p><strong>Runtime:</strong> <span id="movieRuntime">----</span></p>

                <p><strong>Director:</strong> <span id="movieDirector">----</span></p>

                <p><strong>Actors:</strong> <span id="movieActors">----</span></p>

                <h3>Plot</h3>

                <p id="moviePlot">
                    Search for a movie to see its description.
                </p>

            </div>

        </div>

    </section>
</body>
<script src="movie.js" defer></script>
</html>
